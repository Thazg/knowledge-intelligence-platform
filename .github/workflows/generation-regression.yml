name: Generation Regression

on:
  workflow_dispatch:

  # Temporary trigger while validating the workflow
  # on feature/generation-regression.
  push:
    branches:
      - feature/generation-regression
    paths:
      - ".github/workflows/generation-regression.yml"

permissions:
  contents: read

jobs:
  self-hosted-preflight:
    name: Self-hosted Windows preflight

    runs-on:
      - self-hosted
      - Windows
      - X64
      - generation

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        shell: pwsh
        run: |
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Runner OS: $env:RUNNER_OS"

      - name: Verify Python
        shell: pwsh
        run: |
          python --version

      - name: Verify Docker
        shell: pwsh
        run: |
          docker version

      - name: Verify Ollama
        shell: pwsh
        run: |
          ollama --version
          ollama list

      - name: Verify Ollama API
        shell: pwsh
        run: |
          $response = Invoke-RestMethod `
            http://localhost:11434/api/tags

          $response.models |
            Select-Object name, digest, size |
            ConvertTo-Json -Depth 5