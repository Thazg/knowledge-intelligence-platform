name: Generation Regression

on:
  workflow_dispatch:

  # Temporary trigger for validating this new workflow
  # before it exists on the default branch.
  push:
    branches:
      - feature/generation-regression
    paths:
      - ".github/workflows/generation-regression.yml"

permissions:
  contents: read

jobs:
  generation-regression:
    name: Generation regression
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify generation benchmark manifest
        run: |
          pytest tests/evaluation/test_generation_manifest.py -q

      - name: Load frozen retrieval environment
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          generation_manifest = json.loads(
              Path(
                  "benchmarks/generation/v1/manifest.json"
              ).read_text(encoding="utf-8")
          )

          retrieval_manifest_path = Path(
              generation_manifest[
                  "retrieval_dependency"
              ]["manifest_path"]
          )

          retrieval_manifest = json.loads(
              retrieval_manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          qdrant = retrieval_manifest["qdrant"]
          artifacts = retrieval_manifest["artifacts"]

          snapshot = artifacts["qdrant_snapshot"]
          corpus = artifacts["bm25_corpus"]

          values = {
              "RELEASE_TAG": (
                  retrieval_manifest["release_tag"]
              ),
              "COLLECTION_NAME": qdrant["collection"],
              "EXPECTED_POINTS": str(qdrant["points"]),
              "SNAPSHOT_ASSET": snapshot["asset_name"],
              "SNAPSHOT_SIZE": str(
                  snapshot["size_bytes"]
              ),
              "SNAPSHOT_SHA256": snapshot["sha256"],
              "CORPUS_ASSET": corpus["asset_name"],
              "CORPUS_SIZE": str(corpus["size_bytes"]),
              "CORPUS_CHUNKS": str(corpus["chunks"]),
              "CORPUS_SHA256": corpus["sha256"],
          }

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as env_file:
              for key, value in values.items():
                  env_file.write(
                      f"{key}={value}\n"
                  )
          PY

      - name: Wait for Qdrant
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent \
              http://localhost:6333/readyz > /dev/null; then
              echo "Qdrant is ready."
              exit 0
            fi

            echo "Waiting for Qdrant..."
            sleep 2
          done

          echo "Qdrant did not become ready."
          exit 1

      - name: Download frozen retrieval artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .benchmark-assets

          gh release download "$RELEASE_TAG" \
            --pattern "$SNAPSHOT_ASSET" \
            --dir .benchmark-assets

          gh release download "$RELEASE_TAG" \
            --pattern "$CORPUS_ASSET" \
            --dir .benchmark-assets

      - name: Verify frozen retrieval artifacts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path


          def sha256(path: Path) -> str:
              digest = hashlib.sha256()

              with path.open("rb") as file:
                  for block in iter(
                      lambda: file.read(
                          1024 * 1024
                      ),
                      b"",
                  ):
                      digest.update(block)

              return digest.hexdigest().upper()


          snapshot = (
              Path(".benchmark-assets")
              / os.environ["SNAPSHOT_ASSET"]
          )

          corpus = (
              Path(".benchmark-assets")
              / os.environ["CORPUS_ASSET"]
          )

          checks = (
              (
                  snapshot,
                  int(os.environ["SNAPSHOT_SIZE"]),
                  os.environ["SNAPSHOT_SHA256"],
              ),
              (
                  corpus,
                  int(os.environ["CORPUS_SIZE"]),
                  os.environ["CORPUS_SHA256"],
              ),
          )

          for (
              path,
              expected_size,
              expected_hash,
          ) in checks:
              if path.stat().st_size != expected_size:
                  raise SystemExit(
                      f"Size mismatch: {path}"
                  )

              actual_hash = sha256(path)

              if (
                  actual_hash
                  != expected_hash.upper()
              ):
                  raise SystemExit(
                      f"SHA256 mismatch: {path}"
                  )

              print(f"Verified: {path}")

          corpus_lines = sum(
              1
              for _ in corpus.open(
                  "r",
                  encoding="utf-8",
              )
          )

          expected_chunks = int(
              os.environ["CORPUS_CHUNKS"]
          )

          if corpus_lines != expected_chunks:
              raise SystemExit(
                  "BM25 corpus chunk count mismatch."
              )

          print(
              "Corpus chunks verified: "
              f"{corpus_lines:,}"
          )
          PY

      - name: Restore Qdrant snapshot
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "http://localhost:6333/collections/${COLLECTION_NAME}/snapshots/upload?wait=true&priority=snapshot&checksum=${SNAPSHOT_SHA256}" \
            -F "snapshot=@.benchmark-assets/${SNAPSHOT_ASSET}"

          echo

      - name: Verify restored Qdrant collection
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          collection = os.environ[
              "COLLECTION_NAME"
          ]

          expected = int(
              os.environ["EXPECTED_POINTS"]
          )

          url = (
              "http://localhost:6333/collections/"
              + collection
          )

          with urllib.request.urlopen(
              url
          ) as response:
              payload = json.load(response)

          actual = int(
              payload["result"]["points_count"]
          )

          print(
              f"Expected points: {expected:,}"
          )
          print(
              f"Actual points  : {actual:,}"
          )

          if actual != expected:
              raise SystemExit(
                  "Qdrant point count mismatch."
              )
          PY

      - name: Install frozen BM25 corpus
        shell: bash
        run: |
          mkdir -p data/processed

          cp \
            ".benchmark-assets/${CORPUS_ASSET}" \
            data/processed/chunks_fixed.jsonl

      - name: Phase 1 complete
        run: |
          echo "Frozen retrieval environment restored."