name: Generation Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generation-regression-self-hosted
  cancel-in-progress: false

jobs:
  generation-regression:
    name: Generation regression

    runs-on:
      - self-hosted
      - Windows
      - X64
      - generation

    timeout-minutes: 60

    env:
      QDRANT_CONTAINER: enterprise-kip-generation-qdrant
      QDRANT_URL: http://localhost:6335
      QDRANT_COLLECTION: enterprise_knowledge_fixed_bge_small

      SNAPSHOT_NAME: enterprise_knowledge_full_bge_small_v1.snapshot
      SNAPSHOT_SIZE: "162267648"
      SNAPSHOT_SHA256: C729AED452F06A92A78833ECA963B8B7C2CB336E8EFE382AD3BCC6DA7524EDED

      CORPUS_NAME: enterprise_knowledge_chunks_fixed_v1.jsonl
      CORPUS_SIZE: "59361075"
      CORPUS_SHA256: 574E06F89E9EB1B709E015D92A40DC646754004B78FBEDAE0BB77FAD4379B57A
      CORPUS_CHUNK_COUNT: "36199"

      RELEASE_TAG: retrieval-benchmark-v1

      RESULTS_PATH: .benchmark-results\generation-results.jsonl
      EXPECTED_CASE_COUNT: "12"

      PYTHONUNBUFFERED: "1"

      # Avoid filling the C: drive with pip cache.
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      # ============================================================
      # Repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Short benchmark paths
      # ============================================================

      - name: Configure benchmark paths
        shell: powershell
        run: |
          $venvRoot = "D:\gv"
          $venvDir = Join-Path $venvRoot $env:GITHUB_RUN_ID
          $venvPython = Join-Path `
            $venvDir `
            "Scripts\python.exe"

          Write-Host "Virtualenv root: $venvRoot"
          Write-Host "Virtualenv:      $venvDir"
          Write-Host "Python:          $venvPython"

          "VENV_ROOT=$venvRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "VENV_DIR=$venvDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "VENV_PYTHON=$venvPython" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ============================================================
      # Python
      # ============================================================

      - name: Verify host Python 3.13
        shell: powershell
        run: |
          python --version
          where.exe python

          $version = python -c `
            "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"

          Write-Host "Detected Python version: $version"

          if ($version -ne "3.13") {
              throw `
                "Python 3.13 is required. Found: $version"
          }

      - name: Create benchmark virtual environment
        shell: powershell
        run: |
          Write-Host "VENV_ROOT:   $env:VENV_ROOT"
          Write-Host "VENV_DIR:    $env:VENV_DIR"
          Write-Host "VENV_PYTHON: $env:VENV_PYTHON"

          if (
              [string]::IsNullOrWhiteSpace(
                  $env:VENV_DIR
              )
          ) {
              throw "VENV_DIR was not configured."
          }

          if (
              [string]::IsNullOrWhiteSpace(
                  $env:VENV_PYTHON
              )
          ) {
              throw "VENV_PYTHON was not configured."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            $env:VENV_ROOT |
            Out-Null

          if (Test-Path $env:VENV_DIR) {
              Write-Host `
                "Removing previous virtual environment..."

              Remove-Item `
                $env:VENV_DIR `
                -Recurse `
                -Force
          }

          Write-Host `
            "Creating benchmark virtual environment..."

          python -m venv $env:VENV_DIR

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Failed to create benchmark virtual environment."
          }

          & $env:VENV_PYTHON --version

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Benchmark virtual environment Python is unavailable."
          }

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:VENV_PYTHON `
            -m pip install `
            --upgrade pip `
            --no-cache-dir

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to upgrade pip."
          }

          & $env:VENV_PYTHON `
            -m pip install `
            --no-cache-dir `
            -r requirements-dev.txt

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Failed to install benchmark dependencies."
          }

      # ============================================================
      # Generation benchmark manifest
      # ============================================================

      - name: Verify generation benchmark manifest
        shell: powershell
        run: |
          & $env:VENV_PYTHON `
            -m pytest `
            tests\evaluation\test_generation_manifest.py `
            -q

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Generation benchmark manifest verification failed."
          }

      # ============================================================
      # Docker
      # ============================================================

      - name: Verify Docker
        shell: powershell
        run: |
          docker version

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Docker is not available. Ensure Docker Desktop is running."
          }

      # ============================================================
      # Ollama runtime provenance
      # ============================================================

      - name: Verify generation runtime provenance
        shell: powershell
        run: |
          ollama --version

          if ($LASTEXITCODE -ne 0) {
              throw "Ollama CLI is not available."
          }

          ollama list

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to list Ollama models."
          }

          & $env:VENV_PYTHON `
            scripts\check_generation_runtime_provenance.py

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Generation runtime provenance check failed."
          }

      # ============================================================
      # Benchmark directories
      # ============================================================

      - name: Prepare benchmark directories
        shell: powershell
        run: |
          if (Test-Path ".benchmark-assets") {
              Remove-Item `
                ".benchmark-assets" `
                -Recurse `
                -Force
          }

          if (Test-Path ".benchmark-results") {
              Remove-Item `
                ".benchmark-results" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            ".benchmark-assets" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            ".benchmark-results" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            "data\processed" |
            Out-Null

      # ============================================================
      # Frozen retrieval assets
      # ============================================================

      - name: Download frozen retrieval assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "GitHub CLI:"
          gh --version

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI is not available."
          }

          Write-Host "Checking release: $env:RELEASE_TAG"

          gh release view `
            $env:RELEASE_TAG `
            --repo "${{ github.repository }}"

          if ($LASTEXITCODE -ne 0) {
              throw "Frozen retrieval release was not found."
          }

          Write-Host "Downloading frozen retrieval assets..."

          gh release download `
            $env:RELEASE_TAG `
            --repo "${{ github.repository }}" `
            --pattern $env:SNAPSHOT_NAME `
            --pattern $env:CORPUS_NAME `
            --dir ".benchmark-assets" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to download frozen retrieval assets."
          }

          Write-Host "Frozen retrieval assets downloaded."

          Get-ChildItem ".benchmark-assets" |
            Select-Object Name, Length

      - name: Verify frozen retrieval assets
        shell: powershell
        run: |
          $snapshotPath = Join-Path `
            ".benchmark-assets" `
            $env:SNAPSHOT_NAME

          $corpusPath = Join-Path `
            ".benchmark-assets" `
            $env:CORPUS_NAME

          $snapshot = Get-Item $snapshotPath
          $corpus = Get-Item $corpusPath

          Write-Host `
            "Snapshot size: $($snapshot.Length)"

          Write-Host `
            "Corpus size:   $($corpus.Length)"

          if (
              $snapshot.Length -ne
              [int64]$env:SNAPSHOT_SIZE
          ) {
              throw `
                "Snapshot size mismatch: $($snapshot.Length)"
          }

          if (
              $corpus.Length -ne
              [int64]$env:CORPUS_SIZE
          ) {
              throw `
                "Corpus size mismatch: $($corpus.Length)"
          }

          $snapshotHash = (
              Get-FileHash `
                $snapshotPath `
                -Algorithm SHA256
          ).Hash.ToUpper()

          $corpusHash = (
              Get-FileHash `
                $corpusPath `
                -Algorithm SHA256
          ).Hash.ToUpper()

          Write-Host `
            "Snapshot SHA256: $snapshotHash"

          Write-Host `
            "Corpus SHA256:   $corpusHash"

          if (
              $snapshotHash -ne
              $env:SNAPSHOT_SHA256.ToUpper()
          ) {
              throw `
                "Snapshot SHA256 mismatch."
          }

          if (
              $corpusHash -ne
              $env:CORPUS_SHA256.ToUpper()
          ) {
              throw `
                "Corpus SHA256 mismatch."
          }

          $resolvedCorpus = (
              Resolve-Path $corpusPath
          ).Path

          $chunkCount = (
              [System.IO.File]::ReadLines(
                  $resolvedCorpus
              ) |
              Measure-Object
          ).Count

          Write-Host `
            "Frozen corpus chunk count: $chunkCount"

          if (
              $chunkCount -ne
              [int]$env:CORPUS_CHUNK_COUNT
          ) {
              throw `
                "Corpus chunk count mismatch: $chunkCount"
          }

      - name: Install frozen BM25 corpus
        shell: powershell
        run: |
          $source = Join-Path `
            ".benchmark-assets" `
            $env:CORPUS_NAME

          $destination = `
            "data\processed\chunks_fixed.jsonl"

          Copy-Item `
            $source `
            $destination `
            -Force

          Write-Host `
            "Frozen corpus installed at $destination"

      # ============================================================
      # Isolated Qdrant
      # ============================================================

      - name: Remove previous benchmark Qdrant
        shell: powershell
        run: |
          $existing = docker ps `
            -a `
            --format "{{.Names}}" |
            Where-Object {
                $_ -eq $env:QDRANT_CONTAINER
            }

          if ($existing) {
              Write-Host `
                "Removing previous benchmark Qdrant container..."

              docker rm `
                -f `
                $env:QDRANT_CONTAINER

              if ($LASTEXITCODE -ne 0) {
                  throw `
                    "Failed to remove previous benchmark Qdrant container."
              }
          }
          else {
              Write-Host `
                "No previous benchmark Qdrant container found."
          }

      - name: Start isolated Qdrant
        shell: powershell
        run: |
          Write-Host `
            "Pulling pinned Qdrant image..."

          docker pull qdrant/qdrant:v1.19.0

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Failed to pull pinned Qdrant image."
          }

          Write-Host `
            "Starting isolated Qdrant on localhost:6335..."

          docker run `
            -d `
            --name $env:QDRANT_CONTAINER `
            -p 6335:6333 `
            qdrant/qdrant:v1.19.0

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Failed to start isolated Qdrant."
          }

      - name: Wait for isolated Qdrant
        shell: powershell
        run: |
          $ready = $false

          for (
              $attempt = 1;
              $attempt -le 30;
              $attempt++
          ) {
              try {
                  $response = Invoke-WebRequest `
                    -Uri "$env:QDRANT_URL/healthz" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if (
                      $response.StatusCode -eq 200
                  ) {
                      $ready = $true

                      Write-Host `
                        "Qdrant is ready."

                      break
                  }
              }
              catch {
                  Write-Host `
                    "Qdrant not ready yet ($attempt/30)."
              }

              Start-Sleep -Seconds 2
          }

          if (-not $ready) {
              Write-Host `
                "Qdrant failed health check."

              docker logs `
                $env:QDRANT_CONTAINER

              throw `
                "Qdrant did not become ready."
          }

      # ============================================================
      # Frozen Qdrant restore
      # ============================================================

      - name: Restore frozen Qdrant snapshot
        shell: powershell
        run: |
          $snapshotPath = (
              Resolve-Path (
                  Join-Path `
                    ".benchmark-assets" `
                    $env:SNAPSHOT_NAME
              )
          ).Path

          $url = `
            "$env:QDRANT_URL/collections/$env:QDRANT_COLLECTION/snapshots/upload?priority=snapshot&wait=true"

          Write-Host `
            "Restoring frozen Qdrant snapshot..."

          curl.exe `
            --fail `
            --silent `
            --show-error `
            -X POST `
            $url `
            -F "snapshot=@$snapshotPath"

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Qdrant snapshot restore failed."
          }

      - name: Verify restored Qdrant collection
        shell: powershell
        run: |
          $collectionUrl = `
            "$env:QDRANT_URL/collections/$env:QDRANT_COLLECTION"

          $info = Invoke-RestMethod `
            -Uri $collectionUrl

          Write-Host `
            "Collection status: $($info.result.status)"

          Write-Host `
            "Reported points: $($info.result.points_count)"

          $countUrl = `
            "$collectionUrl/points/count"

          $count = Invoke-RestMethod `
            -Method Post `
            -Uri $countUrl `
            -ContentType "application/json" `
            -Body '{"exact":true}'

          $exactCount = `
            $count.result.count

          Write-Host `
            "Exact point count: $exactCount"

          if (
              $exactCount -ne
              [int]$env:CORPUS_CHUNK_COUNT
          ) {
              throw `
                "Qdrant point count mismatch: $exactCount"
          }

      # ============================================================
      # Generation benchmark
      # ============================================================

      - name: Run generation benchmark
        shell: powershell
        run: |
          Write-Host `
            "Running generation benchmark against $env:QDRANT_URL"

          & $env:VENV_PYTHON `
            -u `
            scripts\evaluate_generation_v1.py `
            --qdrant-url $env:QDRANT_URL `
            --output $env:RESULTS_PATH

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Generation benchmark runner failed."
          }

      # ============================================================
      # Deterministic regression gate
      # ============================================================

      - name: Check generation regression
        shell: powershell
        run: |
          & $env:VENV_PYTHON `
            scripts\check_generation_regression.py `
            --results $env:RESULTS_PATH

          if ($LASTEXITCODE -ne 0) {
              throw `
                "Generation regression gate failed."
          }

      - name: Verify result record count
        shell: powershell
        run: |
          if (-not (Test-Path $env:RESULTS_PATH)) {
              throw `
                "Generation results file was not created."
          }

          $count = (
              Get-Content `
                $env:RESULTS_PATH
          ).Count

          Write-Host `
            "Generation result records: $count"

          if (
              $count -ne
              [int]$env:EXPECTED_CASE_COUNT
          ) {
              throw `
                "Expected $env:EXPECTED_CASE_COUNT generation records, got $count."
          }

      # ============================================================
      # Artifacts and diagnostics
      # ============================================================

      - name: Upload generation benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-regression-${{ github.run_id }}
          path: .benchmark-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Show Qdrant logs on failure
        if: failure()
        shell: powershell
        run: |
          $existing = docker ps `
            -a `
            --format "{{.Names}}" |
            Where-Object {
                $_ -eq $env:QDRANT_CONTAINER
            }

          if ($existing) {
              docker logs `
                $env:QDRANT_CONTAINER
          }
          else {
              Write-Host `
                "Benchmark Qdrant container does not exist."
          }

      # ============================================================
      # Cleanup
      # ============================================================

      - name: Cleanup benchmark environment
        if: always()
        shell: powershell
        run: |
          Write-Host `
            "Cleaning generation benchmark environment..."

          $existing = docker ps `
            -a `
            --format "{{.Names}}" |
            Where-Object {
                $_ -eq $env:QDRANT_CONTAINER
            }

          if ($existing) {
              Write-Host `
                "Removing isolated Qdrant container..."

              docker rm `
                -f `
                $env:QDRANT_CONTAINER
          }

          Write-Host `
            "Removing downloaded benchmark assets..."

          Remove-Item `
            ".benchmark-assets" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host `
            "Removing benchmark results from runner workspace..."

          Remove-Item `
            ".benchmark-results" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host `
            "Removing installed frozen corpus..."

          Remove-Item `
            "data\processed\chunks_fixed.jsonl" `
            -Force `
            -ErrorAction SilentlyContinue

          if (
              -not [string]::IsNullOrWhiteSpace(
                  $env:VENV_DIR
              )
          ) {
              if (Test-Path $env:VENV_DIR) {
                  Write-Host `
                    "Removing benchmark virtual environment..."

                  Remove-Item `
                    $env:VENV_DIR `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue
              }
          }

          Write-Host `
            "Generation benchmark cleanup complete."