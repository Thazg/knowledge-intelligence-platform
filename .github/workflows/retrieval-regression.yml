name: Retrieval Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrieval-regression:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Wait for Qdrant
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:6333/readyz; then
              exit 0
            fi
            sleep 1
          done

          echo "Qdrant did not become ready in time."
          exit 1

      - name: Provision retrieval CI collection
        run: python scripts/provision_ci_retrieval_collection.py

      - name: Run retrieval regression check
        run: python scripts/check_retrieval_regression.py